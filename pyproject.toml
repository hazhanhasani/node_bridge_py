[project]
name = "bluepanel-node-bridge"
version = "0.10.0"
description = "Python bridge for connecting BluePanel with BluePanel Node"
url = "https://github.com/hazhanhasani/node_bridge_py"
keywords = [
    "BluePanel-Node",
    "BluePanel",
    "BluePanel-panel",
    "BluePanel python",
    "BluePanel API",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "aiohttp-socks>=0.11.0",
    "grpclib>=0.4.9",
    "packaging>=26.2",
    "protobuf>=6.33.6",
    "python-socks[asyncio]>=2.8.1",
]

classifiers = ["Programming Language :: Python :: 3.12"]

[project.urls]
Homepage = "https://github.com/hazhanhasani/node_bridge_py"
Repository = "https://github.com/hazhanhasani/node_bridge_py.git"

[dependency-groups]
dev = ["grpcio-tools>=1.80.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.6"]

[tool.ruff]
line-length = 120
exclude = ["PasarGuardNodeBridge/common"]

[tool.ruff.lint]
ignore = [
    "N999",
    "BLE001",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["BluePanelNodeBridge", "PasarGuardNodeBridge"]
